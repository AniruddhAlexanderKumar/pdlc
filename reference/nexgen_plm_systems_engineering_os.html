<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexGen PLM - Engineering OS</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        surface: { 50: '#f9fafb', 100: '#f3f4f6', 200: '#e5e5e5', 300: '#d4d4d4', 400: '#a3a3a3', 500: '#737373', 600: '#525252', 700: '#404040', 800: '#262626', 900: '#0a0a0a', 950: '#000000' },
                        brand: { DEFAULT: '#00e5ff', hover: '#00b3cc', subtle: '#004d56' },
                        sys: { req: '#a855f7', arch: '#3b82f6', verify: '#10b981', risk: '#ef4444', change: '#f59e0b', release: '#ec4899' }
                    }
                }
            }
        }
    </script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000000; color: #e5e5e5; overflow: hidden; -webkit-font-smoothing: antialiased; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #000000; }
        ::-webkit-scrollbar-thumb { background: #262626; }
        ::-webkit-scrollbar-thumb:hover { background: #404040; }
        
        .glass-panel { background: #0a0a0a; border: 1px solid #262626; border-radius: 2px; }
        .data-row { transition: all 0.1s ease; border-bottom: 1px solid #171717; }
        .data-row:hover { background: #171717; }
        .tree-line { position: absolute; left: 11px; top: 24px; bottom: 0; width: 1px; background: #262626; z-index: 0; }
        
        @keyframes slideIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide-in { animation: slideIn 0.2s ease-out forwards; }

        /* Force sharp, technical corners globally to restore mission control aesthetic */
        .rounded-xl, .rounded-lg, .rounded-md, .rounded { border-radius: 2px !important; }
        .rounded-full.w-10, .rounded-full.w-8, .rounded-full.w-9 { border-radius: 50% !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // This acts as the relational data model for the engineering lifecycle
        const initialDatabase = {
            project: { id: 'PRJ-AERO-01', name: 'NextGen Electromechanical Actuator', phase: 'Detailed Design' },
            opportunities: [
                { id: 'OPP-001', title: 'Mass Reduction Program', problem: 'Current actuator exceeds 2.4kg allocation', status: 'Approved' }
            ],
            requirements: [
                { id: 'REQ-001', type: 'Physical', text: 'The actuator assembly mass shall not exceed 2.0 kg.', allocatedTo: 'SYS-001', status: 'Baselined' },
                { id: 'REQ-002', type: 'Performance', text: 'Actuator stroke time shall be < 0.8s under 5kN load.', allocatedTo: 'SYS-002', status: 'Baselined' },
                { id: 'REQ-003', type: 'Safety', text: 'Loss of function probability shall be < 1E-9/fh.', allocatedTo: 'SYS-001', status: 'In Review' },
                { id: 'REQ-004', type: 'Interface', text: 'The actuator shall mount using standard 4-bolt flange geometry.', allocatedTo: 'SYS-001', status: 'Draft' }
            ],
            architecture: [
                { id: 'SYS-001', name: 'Actuator Assembly', parent: null, type: 'System' },
                { id: 'SYS-002', name: 'Brushless DC Motor', parent: 'SYS-001', type: 'Component' },
                { id: 'SYS-003', name: 'Motor Controller PCBA', parent: 'SYS-001', type: 'Electronic Hardware' },
                { id: 'SYS-004', name: 'Gear Train', parent: 'SYS-001', type: 'Component' }
            ],
            risks: [
                { id: 'RSK-001', title: 'Motor Thermal Overload', severity: 'High', linkedReq: 'REQ-002', linkedSys: 'SYS-002', status: 'Open', mitigation: 'Active cooling jacket' },
                { id: 'RSK-002', title: 'Supplier Lead Time', severity: 'Medium', linkedReq: null, linkedSys: 'SYS-003', status: 'Mitigated', mitigation: 'Dual sourcing' }
            ],
            verification: [
                { id: 'VRF-001', name: 'Mass Measurement Test', method: 'Inspection', reqId: 'REQ-001', status: 'Passed', result: 'Measured 1.95kg' },
                { id: 'VRF-002', name: 'Dynamic Load Test', method: 'Test', reqId: 'REQ-002', status: 'Failed', result: 'Stroke time 0.92s (Fails <0.8s)' },
                { id: 'VRF-003', name: 'Flange Dimension Check', method: 'Inspection', reqId: 'REQ-004', status: 'Pending', result: null }
            ],
            nonconformances: [
                { id: 'NC-001', title: 'Test VRF-002 Failed', linkedVrf: 'VRF-002', status: 'Investigation', description: 'Motor struggles under peak 5kN load.' }
            ]
        };

        const StatusBadge = ({ status }) => {
            const colors = {
                'Draft': 'text-surface-400 border-surface-700',
                'In Review': 'text-amber-400 border-amber-500/40 shadow-[0_0_8px_rgba(251,191,36,0.15)]',
                'Approved': 'text-brand border-brand/40 shadow-[0_0_8px_rgba(0,229,255,0.15)]',
                'Baselined': 'text-purple-400 border-purple-500/40 shadow-[0_0_8px_rgba(168,85,247,0.15)]',
                'Passed': 'text-emerald-400 border-emerald-500/40 shadow-[0_0_8px_rgba(16,185,129,0.15)]',
                'Mitigated': 'text-emerald-400 border-emerald-500/40',
                'Failed': 'text-red-500 border-red-500/40 shadow-[0_0_8px_rgba(239,68,68,0.15)]',
                'Open': 'text-red-500 border-red-500/40 shadow-[0_0_8px_rgba(239,68,68,0.15)]',
                'High': 'text-red-500 border-red-500/40 shadow-[0_0_8px_rgba(239,68,68,0.15)]',
                'Medium': 'text-amber-400 border-amber-500/40',
                'Pending': 'text-orange-400 border-orange-500/40',
                'Investigation': 'text-orange-400 border-orange-500/40'
            };
            return <span className={`px-2 py-0.5 text-[10px] font-mono font-bold uppercase tracking-wider border bg-black/50 ${colors[status] || colors.Draft}`}>{status}</span>;
        };

        const SectionHeader = ({ title, subtitle, icon, color }) => (
            <div className="mb-6 border-b border-surface-800 pb-4 flex flex-col gap-1">
                <h2 className="text-lg font-mono font-bold text-white flex items-center gap-3 tracking-wide">
                    <i className={`${icon} ${color}`}></i> {title.toUpperCase()}
                </h2>
                <p className="text-[10px] font-mono text-surface-400 uppercase tracking-widest">{subtitle}</p>
            </div>
        );

        const DashboardView = ({ db }) => {
            const totalReqs = db.requirements.length;
            const allocatedReqs = db.requirements.filter(r => r.allocatedTo).length;
            const baselinedReqs = db.requirements.filter(r => r.status === 'Baselined').length;
            
            const totalTests = db.verification.length;
            const passedTests = db.verification.filter(v => v.status === 'Passed').length;
            const failedTests = db.verification.filter(v => v.status === 'Failed').length;
            
            const highRisks = db.risks.filter(r => r.severity === 'High' && r.status === 'Open').length;
            const openNCs = db.nonconformances.filter(n => n.status !== 'Closed').length;

            const isReleaseReady = failedTests === 0 && allocatedReqs === totalReqs && baselinedReqs === totalReqs && highRisks === 0;

            return (
                <div className="p-6 h-full overflow-y-auto animate-slide-in">
                    <SectionHeader title="Engineering Control Center" subtitle={`Project: ${db.project.name} | Phase: ${db.project.phase}`} icon="ph-gauge" color="text-white" />
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                        {/* Requirement Health */}
                        <div className="glass-panel p-5 rounded-xl border-t-2 border-t-sys-req">
                            <h3 className="text-xs font-bold text-surface-400 uppercase tracking-widest mb-4 flex justify-between">Requirement Allocation <i className="ph-list-checks text-sys-req"></i></h3>
                            <div className="flex justify-between items-end mb-2">
                                <div className="text-3xl font-mono text-white">{Math.round((allocatedReqs/totalReqs)*100 || 0)}%</div>
                                <div className="text-xs text-surface-400">Allocated to PBS</div>
                            </div>
                            <div className="w-full bg-surface-900 h-1.5 rounded-full overflow-hidden">
                                <div className="bg-sys-req h-full" style={{width: `${(allocatedReqs/totalReqs)*100}%`}}></div>
                            </div>
                            <div className="mt-3 text-[10px] text-surface-400">{baselinedReqs} of {totalReqs} requirements baselined.</div>
                        </div>

                        {/* Verification Health */}
                        <div className="glass-panel p-5 rounded-xl border-t-2 border-t-sys-verify">
                            <h3 className="text-xs font-bold text-surface-400 uppercase tracking-widest mb-4 flex justify-between">Verification Status <i className="ph-check-circle text-sys-verify"></i></h3>
                            <div className="flex justify-between items-end mb-2">
                                <div className="text-3xl font-mono text-white">{Math.round((passedTests/totalTests)*100 || 0)}%</div>
                                <div className="text-xs text-surface-400">Tests Passed</div>
                            </div>
                            <div className="w-full bg-surface-900 h-1.5 rounded-full overflow-hidden flex">
                                <div className="bg-sys-verify h-full" style={{width: `${(passedTests/totalTests)*100}%`}}></div>
                                <div className="bg-red-500 h-full" style={{width: `${(failedTests/totalTests)*100}%`}}></div>
                            </div>
                            <div className="mt-3 text-[10px] text-red-400 flex items-center gap-1">
                                {failedTests > 0 ? <><i className="ph-warning"></i> {failedTests} critical failures.</> : 'All executed tests passing.'}
                            </div>
                        </div>
                        
                        {/* Risks & Issues */}
                        <div className="glass-panel p-5 rounded-xl border-t-2 border-t-sys-risk">
                            <h3 className="text-xs font-bold text-surface-400 uppercase tracking-widest mb-4 flex justify-between">Safety & Quality <i className="ph-warning-circle text-sys-risk"></i></h3>
                            <div className="flex justify-between items-end mb-4">
                                <div>
                                    <div className="text-2xl font-mono text-white leading-none">{highRisks}</div>
                                    <div className="text-[10px] text-surface-400 uppercase tracking-widest mt-1">High Risks</div>
                                </div>
                                <div className="text-right">
                                    <div className="text-2xl font-mono text-white leading-none">{openNCs}</div>
                                    <div className="text-[10px] text-surface-400 uppercase tracking-widest mt-1">Open NCs</div>
                                </div>
                            </div>
                            <div className="text-[10px] text-surface-400 flex items-center gap-1">
                                {highRisks > 0 ? <span className="text-red-400">Requires immediate mitigation.</span> : 'Risks within acceptable margins.'}
                            </div>
                        </div>

                        {/* Release Gate Readiness */}
                        <div className={`glass-panel p-5 rounded-xl border-t-2 ${isReleaseReady ? 'border-t-sys-release' : 'border-t-red-500'}`}>
                            <h3 className="text-xs font-bold text-surface-400 uppercase tracking-widest mb-4 flex justify-between">Gate Readiness <i className="ph-flag-checkered text-sys-release"></i></h3>
                            <div className="flex items-center gap-4 mb-4">
                                <div className={`w-10 h-10 rounded-full flex items-center justify-center text-xl ${isReleaseReady ? 'bg-sys-release/20 text-sys-release' : 'bg-red-500/20 text-red-500'}`}>
                                    <i className={isReleaseReady ? "ph-check-bold" : "ph-x-bold"}></i>
                                </div>
                                <div>
                                    <div className="text-sm font-bold text-white">{isReleaseReady ? 'Ready for Review' : 'Gate Blocked'}</div>
                                    <div className="text-[10px] text-surface-400">{isReleaseReady ? 'All criteria met.' : 'Unresolved blockers.'}</div>
                                </div>
                            </div>
                            {!isReleaseReady && (
                                <div className="space-y-1 overflow-y-auto max-h-16 pr-2">
                                    {failedTests > 0 && <div className="text-[9px] bg-red-500/10 text-red-400 p-1 rounded border border-red-500/20 truncate">Resolve {failedTests} failed test(s)</div>}
                                    {highRisks > 0 && <div className="text-[9px] bg-red-500/10 text-red-400 p-1 rounded border border-red-500/20 truncate">Mitigate {highRisks} high risk(s)</div>}
                                    {allocatedReqs < totalReqs && <div className="text-[9px] bg-amber-500/10 text-amber-400 p-1 rounded border border-amber-500/20 truncate">Allocate {totalReqs - allocatedReqs} orphaned requirement(s)</div>}
                                    {baselinedReqs < totalReqs && <div className="text-[9px] bg-amber-500/10 text-amber-400 p-1 rounded border border-amber-500/20 truncate">Baseline all requirements</div>}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const RequirementsView = ({ db }) => {
            const [selectedId, setSelectedId] = useState(null);

            return (
                <div className="flex h-full animate-slide-in">
                    <div className="flex-1 p-6 flex flex-col h-full overflow-hidden">
                        <SectionHeader title="Requirements Engineering" subtitle="Author, allocate, and establish bidirectional traceability." icon="ph-list-checks" color="text-sys-req" />
                        
                        <div className="flex-1 glass-panel rounded-xl flex flex-col overflow-hidden">
                            <div className="grid grid-cols-12 gap-4 p-3 border-b border-white/10 bg-surface-900/50 text-[10px] font-bold text-surface-400 uppercase tracking-wider">
                                <div className="col-span-2">ID</div>
                                <div className="col-span-6">Statement</div>
                                <div className="col-span-2">Type</div>
                                <div className="col-span-2 text-right">Status</div>
                            </div>
                            <div className="flex-1 overflow-y-auto">
                                {db.requirements.map(req => (
                                    <div key={req.id} onClick={() => setSelectedId(req.id)} className={`grid grid-cols-12 gap-4 p-3 data-row cursor-pointer items-center ${selectedId === req.id ? 'bg-sys-req/10 border-l-2 border-sys-req' : 'border-l-2 border-transparent'}`}>
                                        <div className="col-span-2 font-mono text-[11px] font-bold text-sys-req">{req.id}</div>
                                        <div className="col-span-6 text-sm text-surface-200 truncate pr-4">{req.text}</div>
                                        <div className="col-span-2 text-xs text-surface-400">{req.type}</div>
                                        <div className="col-span-2 text-right"><StatusBadge status={req.status} /></div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Side Panel: Requirement Traceability Graph */}
                    {selectedId && (
                        <div className="w-96 border-l border-white/10 bg-surface-900/80 p-6 overflow-y-auto shadow-2xl">
                            {(() => {
                                const req = db.requirements.find(r => r.id === selectedId);
                                const allocation = db.architecture.find(a => a.id === req.allocatedTo);
                                const tests = db.verification.filter(v => v.reqId === req.id);
                                const risks = db.risks.filter(r => r.linkedReq === req.id);
                                
                                return (
                                    <div className="animate-slide-in">
                                        <div className="flex justify-between items-center mb-6">
                                            <span className="font-mono text-sm font-bold text-sys-req bg-sys-req/10 px-2 py-1 rounded border border-sys-req/20">{req.id}</span>
                                            <button onClick={() => setSelectedId(null)} className="text-surface-400 hover:text-white transition-colors"><i className="ph-x text-lg"></i></button>
                                        </div>
                                        <h3 className="text-sm font-medium text-white mb-6 leading-relaxed">{req.text}</h3>
                                        
                                        <div className="space-y-6">
                                            <div>
                                                <h4 className="text-[10px] font-bold text-surface-500 uppercase tracking-widest mb-3 border-b border-white/5 pb-1 flex items-center gap-2">
                                                    <i className="ph-cube text-sys-arch"></i> Architecture Allocation
                                                </h4>
                                                {allocation ? (
                                                    <div className="bg-surface-800 p-3 rounded-lg border border-sys-arch/30">
                                                        <div className="text-[11px] font-mono text-sys-arch mb-1">{allocation.id}</div>
                                                        <div className="text-xs text-white">{allocation.name}</div>
                                                        <div className="text-[10px] text-surface-400 mt-1 uppercase">{allocation.type}</div>
                                                    </div>
                                                ) : <div className="text-xs text-amber-400 p-3 bg-amber-400/10 rounded border border-amber-400/20">Unallocated - Architecture Deficit</div>}
                                            </div>

                                            <div>
                                                <h4 className="text-[10px] font-bold text-surface-500 uppercase tracking-widest mb-3 border-b border-white/5 pb-1 flex items-center gap-2">
                                                    <i className="ph-check-circle text-sys-verify"></i> Verification Evidence
                                                </h4>
                                                {tests.length > 0 ? tests.map(test => (
                                                    <div key={test.id} className={`bg-surface-800 p-3 rounded-lg border mb-2 ${test.status === 'Passed' ? 'border-sys-verify/30' : test.status === 'Failed' ? 'border-red-500/30' : 'border-white/10'}`}>
                                                        <div className="flex justify-between items-start mb-2">
                                                            <div className="text-[11px] font-mono font-bold text-white">{test.id}</div>
                                                            <StatusBadge status={test.status} />
                                                        </div>
                                                        <div className="text-xs text-surface-300 mb-2">{test.name}</div>
                                                        {test.result && <div className="text-[10px] text-surface-400 p-1.5 bg-black/30 rounded font-mono break-all">&gt; {test.result}</div>}
                                                    </div>
                                                )) : <div className="text-xs text-amber-400 p-3 bg-amber-400/10 rounded border border-amber-400/20">No verification tests planned</div>}
                                            </div>
                                            
                                            {risks.length > 0 && (
                                                <div>
                                                    <h4 className="text-[10px] font-bold text-surface-500 uppercase tracking-widest mb-3 border-b border-white/5 pb-1 flex items-center gap-2">
                                                        <i className="ph-warning text-sys-risk"></i> Linked Risks
                                                    </h4>
                                                    {risks.map(risk => (
                                                        <div key={risk.id} className="bg-surface-800 p-3 rounded-lg border border-sys-risk/30 mb-2">
                                                            <div className="flex justify-between items-start mb-1">
                                                                <div className="text-[11px] font-mono font-bold text-sys-risk">{risk.id}</div>
                                                                <StatusBadge status={risk.severity} />
                                                            </div>
                                                            <div className="text-xs text-white">{risk.title}</div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )
                            })()}
                        </div>
                    )}
                </div>
            );
        };

        const ArchitectureView = ({ db }) => {
            return (
                <div className="p-6 h-full animate-slide-in">
                    <SectionHeader title="Product Breakdown Structure" subtitle="Hierarchical system decomposition and component mapping." icon="ph-tree-structure" color="text-sys-arch" />
                    <div className="glass-panel p-6 rounded-xl">
                        <div className="font-mono text-xs text-sys-arch mb-4 border-b border-white/10 pb-2">Aircraft Level</div>
                        <div className="pl-4 space-y-3 relative">
                            <div className="tree-line"></div>
                            {db.architecture.map(node => (
                                <div key={node.id} className="bg-surface-800/80 border border-white/5 p-4 rounded flex justify-between items-center relative z-10 transition-colors hover:border-sys-arch/30">
                                    <div>
                                        <div className="flex items-center gap-3">
                                            <i className={node.type === 'System' ? 'ph-cube text-sys-arch text-xl' : 'ph-cpu text-surface-400 text-xl'}></i>
                                            <div>
                                                <div className="flex items-center gap-2">
                                                    <span className="font-mono text-xs font-bold text-white">{node.id}</span>
                                                    <span className="text-[10px] px-1.5 py-0.5 rounded bg-surface-900 text-surface-400 border border-surface-700">{node.type}</span>
                                                </div>
                                                <div className="text-sm font-medium mt-1 text-surface-200">{node.name}</div>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="text-right">
                                        <div className="text-[10px] text-surface-400 uppercase tracking-widest mb-1">Allocated Reqs</div>
                                        <div className="font-mono text-lg font-bold text-sys-req">
                                            {db.requirements.filter(r => r.allocatedTo === node.id).length}
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const VerificationView = ({ db, updateDB }) => {
            const handleExecute = (id) => {
                // Simulating a test execution that fixes the failing test or runs a pending test
                const updatedDB = { ...db };
                const testIndex = updatedDB.verification.findIndex(t => t.id === id);
                if (testIndex > -1) {
                    updatedDB.verification[testIndex].status = 'Passed';
                    updatedDB.verification[testIndex].result = id === 'VRF-002' 
                        ? 'Stroke time 0.78s (Passes <0.8s) - Post Design Change'
                        : 'Measured within standard tolerance.';
                    
                    // Automatically resolve associated Nonconformance if any
                    const ncIndex = updatedDB.nonconformances.findIndex(nc => nc.linkedVrf === id);
                    if(ncIndex > -1) {
                        updatedDB.nonconformances[ncIndex].status = 'Closed';
                    }
                    
                    updateDB(updatedDB);
                }
            };

            return (
                <div className="p-6 h-full flex flex-col animate-slide-in">
                    <SectionHeader title="Verification & Validation" subtitle="Execute procedures and capture evidence against requirements." icon="ph-check-circle" color="text-sys-verify" />
                    
                    <div className="grid gap-4 grid-cols-1 lg:grid-cols-2 overflow-y-auto pb-6">
                        {db.verification.map(test => {
                            const req = db.requirements.find(r => r.id === test.reqId);
                            return (
                                <div key={test.id} className="glass-panel p-5 rounded-xl border border-white/10 flex flex-col hover:border-white/20 transition-colors">
                                    <div className="flex justify-between items-start mb-4">
                                        <div>
                                            <div className="flex items-center gap-2 mb-1">
                                                <span className="font-mono text-[10px] font-bold text-sys-verify bg-sys-verify/10 px-1.5 py-0.5 rounded border border-sys-verify/20">{test.id}</span>
                                                <span className="text-[10px] text-surface-400 border border-surface-700 px-1.5 py-0.5 rounded">{test.method}</span>
                                            </div>
                                            <h3 className="text-sm font-bold text-white">{test.name}</h3>
                                        </div>
                                        <StatusBadge status={test.status} />
                                    </div>
                                    
                                    <div className="bg-surface-900/50 p-3 rounded flex items-start gap-3 mb-4 flex-1">
                                        <i className="ph-link text-surface-500 mt-0.5"></i>
                                        <div>
                                            <div className="text-[10px] text-surface-500 font-mono mb-0.5">Verifies Requirement: {req?.id}</div>
                                            <div className="text-xs text-surface-300 line-clamp-2">{req?.text}</div>
                                        </div>
                                    </div>

                                    {/* FIX: Escaped the > character to &gt; to prevent JSX syntax errors */}
                                    {test.result && (
                                        <div className="mb-4">
                                            <div className="text-[10px] text-surface-500 uppercase tracking-widest mb-1">Execution Result</div>
                                            <div className={`text-xs font-mono p-2 rounded ${test.status === 'Passed' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-red-500/10 text-red-400 border border-red-500/20'}`}>
                                                &gt; {test.result}
                                            </div>
                                        </div>
                                    )}

                                    <div className="mt-auto pt-4 border-t border-white/5 flex justify-end">
                                        {(test.status === 'Failed' || test.status === 'Pending') ? (
                                            <button onClick={() => handleExecute(test.id)} className="bg-sys-verify hover:bg-emerald-600 text-white text-xs font-bold px-4 py-2 rounded transition-colors flex items-center gap-2 shadow-lg shadow-sys-verify/20">
                                                <i className="ph-play"></i> {test.status === 'Failed' ? 'Re-Execute Test' : 'Run Procedure'}
                                            </button>
                                        ) : (
                                            <button disabled className="bg-surface-800 text-surface-500 text-xs font-bold px-4 py-2 rounded cursor-not-allowed border border-white/5">
                                                <i className="ph-check"></i> Evidence Accepted
                                            </button>
                                        )}
                                    </div>
                                </div>
                            )
                        })}
                    </div>
                </div>
            )
        };

        const ChangeControlView = ({ db }) => {
            const [selectedReqForChange, setSelectedReqForChange] = useState(null);

            const analyzeImpact = (reqId) => {
                const req = db.requirements.find(r => r.id === reqId);
                const impactedSys = db.architecture.find(a => a.id === req?.allocatedTo);
                const impactedTests = db.verification.filter(v => v.reqId === reqId);
                const impactedRisks = db.risks.filter(r => r.linkedReq === reqId);
                return { req, impactedSys, impactedTests, impactedRisks };
            };

            return (
                <div className="p-6 h-full flex flex-col animate-slide-in">
                    <SectionHeader title="Change Control Board" subtitle="Automated Impact Analysis (The Ripple Effect) for Engineering Changes." icon="ph-git-merge" color="text-sys-change" />
                    
                    <div className="flex flex-col lg:flex-row gap-6 h-[calc(100%-80px)]">
                        {/* Source Selection */}
                        <div className="w-full lg:w-1/3 flex flex-col">
                            <h3 className="text-xs font-bold text-surface-400 uppercase tracking-widest mb-3">Select Object to Modify</h3>
                            <div className="glass-panel flex-1 rounded-xl p-3 overflow-y-auto space-y-2">
                                {db.requirements.map(req => (
                                    <div key={req.id} onClick={() => setSelectedReqForChange(req.id)} className={`p-4 border rounded cursor-pointer transition-all ${selectedReqForChange === req.id ? 'border-sys-change bg-sys-change/10 shadow-lg shadow-sys-change/10' : 'border-white/5 bg-surface-900/50 hover:border-white/20'}`}>
                                        <div className="flex justify-between items-center mb-2">
                                            <div className="text-xs font-mono text-sys-req font-bold">{req.id}</div>
                                            <StatusBadge status={req.status} />
                                        </div>
                                        <div className="text-xs text-surface-200 line-clamp-2">{req.text}</div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Impact Canvas */}
                        <div className="flex-1 glass-panel rounded-xl p-6 relative overflow-hidden flex flex-col bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-surface-900 via-surface-950 to-surface-950 border-sys-change/20">
                            {!selectedReqForChange ? (
                                <div className="m-auto text-center text-surface-500">
                                    <div className="w-16 h-16 rounded-full bg-surface-800 flex items-center justify-center mx-auto mb-4 border border-white/5">
                                        <i className="ph-git-merge text-3xl text-surface-400"></i>
                                    </div>
                                    <p className="text-sm font-medium text-white mb-1">Select an item to run Impact Analysis</p>
                                    <p className="text-xs">Trace downstream dependencies across the product lifecycle.</p>
                                </div>
                            ) : (
                                (() => {
                                    const impact = analyzeImpact(selectedReqForChange);
                                    return (
                                        <div className="animate-slide-in flex-1 overflow-y-auto pr-2">
                                            <div className="bg-surface-900 border border-sys-change/40 p-5 rounded-lg mb-8 shadow-lg shadow-sys-change/5 relative overflow-hidden">
                                                <div className="absolute top-0 left-0 w-1 h-full bg-sys-change"></div>
                                                <div className="text-[10px] text-sys-change font-bold uppercase tracking-widest mb-2 flex items-center gap-2">
                                                    <i className="ph-target"></i> Proposed Change Target
                                                </div>
                                                <div className="font-mono text-sm font-bold text-white mb-1">{impact.req.id}</div>
                                                <div className="text-sm text-surface-300">{impact.req.text}</div>
                                            </div>

                                            <h4 className="text-xs font-bold text-surface-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                                                <i className="ph-arrows-split"></i> Downstream Impact Identified
                                            </h4>
                                            
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                {impact.impactedSys && (
                                                    <div className="p-4 bg-surface-900 border border-sys-arch/30 rounded-lg">
                                                        <div className="text-[10px] text-surface-500 uppercase tracking-widest mb-3">Affected Architecture</div>
                                                        <div className="flex items-center gap-3">
                                                            <div className="w-10 h-10 rounded bg-sys-arch/10 flex items-center justify-center">
                                                                <i className="ph-cube text-sys-arch text-xl"></i>
                                                            </div>
                                                            <div>
                                                                <div className="font-mono text-xs font-bold text-sys-arch">{impact.impactedSys.id}</div>
                                                                <div className="text-xs text-white">{impact.impactedSys.name}</div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                )}

                                                {impact.impactedTests.map(test => (
                                                    <div key={test.id} className="p-4 bg-surface-900 border border-sys-verify/30 rounded-lg">
                                                        <div className="text-[10px] text-surface-500 uppercase tracking-widest mb-3">Invalidates Verification</div>
                                                        <div className="flex items-center gap-3">
                                                            <div className="w-10 h-10 rounded bg-sys-verify/10 flex items-center justify-center">
                                                                <i className="ph-check-square text-sys-verify text-xl"></i>
                                                            </div>
                                                            <div>
                                                                <div className="font-mono text-xs font-bold text-sys-verify">{test.id}</div>
                                                                <div className="text-xs text-white line-clamp-1">{test.name}</div>
                                                                <div className="text-[10px] text-amber-500 mt-1 bg-amber-500/10 px-1.5 py-0.5 rounded inline-block">Requires Re-test</div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))}
                                                
                                                {impact.impactedRisks.map(risk => (
                                                    <div key={risk.id} className="p-4 bg-surface-900 border border-red-500/30 rounded-lg">
                                                        <div className="text-[10px] text-surface-500 uppercase tracking-widest mb-3">Re-opens Safety Risk</div>
                                                        <div className="flex items-center gap-3">
                                                            <div className="w-10 h-10 rounded bg-red-500/10 flex items-center justify-center">
                                                                <i className="ph-warning text-red-500 text-xl"></i>
                                                            </div>
                                                            <div>
                                                                <div className="font-mono text-xs font-bold text-red-500">{risk.id}</div>
                                                                <div className="text-xs text-white line-clamp-1">{risk.title}</div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                            
                                            <div className="mt-8 pt-4 border-t border-white/10 text-right">
                                                <button className="bg-sys-change hover:bg-amber-600 text-white text-xs font-bold px-6 py-2.5 rounded transition-colors shadow-lg shadow-sys-change/20">
                                                    Generate Change Request (ECR)
                                                </button>
                                            </div>
                                        </div>
                                    )
                                })()
                            )}
                        </div>
                    </div>
                </div>
            )
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            
            // Persistent DB hook using localStorage
            const [db, setDb] = useState(() => {
                try {
                    const saved = localStorage.getItem('nexgen_os_db');
                    return saved ? JSON.parse(saved) : initialDatabase;
                } catch (e) {
                    console.error("Failed to parse database from localStorage", e);
                    return initialDatabase;
                }
            });

            useEffect(() => {
                localStorage.setItem('nexgen_os_db', JSON.stringify(db));
            }, [db]);

            const tabs = [
                { id: 'dashboard', label: 'Telemetry', icon: 'ph-gauge', color: 'text-white', border: 'border-t-brand' },
                { id: 'reqs', label: 'Requirements', icon: 'ph-list-checks', color: 'text-sys-req', border: 'border-t-sys-req' },
                { id: 'arch', label: 'Architecture', icon: 'ph-tree-structure', color: 'text-sys-arch', border: 'border-t-sys-arch' },
                { id: 'verify', label: 'Verification', icon: 'ph-check-circle', color: 'text-sys-verify', border: 'border-t-sys-verify' },
                { id: 'change', label: 'Change Control', icon: 'ph-git-merge', color: 'text-sys-change', border: 'border-t-sys-change' }
            ];

            return (
                <div className="h-screen w-full flex flex-col bg-black text-surface-200 font-sans selection:bg-brand/30">
                    
                    {/* Top Navigation Tab Bar */}
                    <header className="bg-[#0a0a0a] border-b border-surface-800 flex items-end px-4 pt-3 z-20 shrink-0">
                        {/* Branding */}
                        <div className="flex items-center gap-3 mr-8 mb-2">
                            <div className="w-7 h-7 bg-brand/10 flex items-center justify-center text-brand border border-brand/30">
                                <i className="ph-rocket-launch text-base"></i>
                            </div>
                            <div>
                                <h1 className="font-mono font-bold text-white text-xs leading-none tracking-widest uppercase">NexGen OS</h1>
                                <p className="text-[8px] text-surface-500 font-mono tracking-widest uppercase mt-1">Systems Eng.</p>
                            </div>
                        </div>

                        {/* Tabs */}
                        <div className="flex-1 flex gap-1 overflow-x-auto no-scrollbar">
                            {tabs.map((tab, idx) => (
                                <button 
                                    key={tab.id} 
                                    onClick={() => setActiveTab(tab.id)} 
                                    className={`flex items-center gap-2 px-5 py-2.5 text-[11px] font-mono font-bold uppercase tracking-wider transition-all duration-150 border-t-2 border-x border-x-transparent ${
                                        activeTab === tab.id 
                                        ? `bg-black text-white ${tab.border} border-x-surface-800` 
                                        : 'bg-transparent text-surface-500 border-t-transparent hover:bg-surface-900 hover:text-surface-300'
                                    }`}
                                >
                                    <span className={`text-[9px] opacity-50 ${activeTab === tab.id ? tab.color : ''}`}>0{idx + 1}</span>
                                    <i className={`${tab.icon} text-lg ${activeTab === tab.id ? tab.color : 'opacity-70'}`}></i>
                                    {tab.label}
                                </button>
                            ))}
                        </div>
                        
                        {/* User & Actions */}
                        <div className="flex items-center gap-4 mb-2 ml-4">
                            <button onClick={() => { setDb(initialDatabase); setActiveTab('dashboard'); }} className="px-3 py-1 border border-red-500/30 text-red-500 hover:bg-red-500/10 text-[9px] font-mono uppercase tracking-widest transition-colors rounded">
                                Reset Demo
                            </button>
                            <div className="flex items-center gap-2 pl-4 border-l border-surface-800">
                                <div className="text-right">
                                    <div className="text-[10px] font-mono font-bold text-white">CE-001</div>
                                    <div className="text-[8px] font-mono text-brand flex items-center gap-1 justify-end"><span className="w-1.5 h-1.5 bg-brand animate-pulse"></span> ONLINE</div>
                                </div>
                                <div className="w-7 h-7 bg-surface-800 text-surface-300 flex items-center justify-center border border-surface-700">
                                    <i className="ph-user text-xs"></i>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Main Content Workspace */}
                    <main className="flex-1 relative overflow-hidden bg-black">
                        {activeTab === 'dashboard' && <DashboardView db={db} />}
                        {activeTab === 'reqs' && <RequirementsView db={db} />}
                        {activeTab === 'arch' && <ArchitectureView db={db} />}
                        {activeTab === 'verify' && <VerificationView db={db} updateDB={setDb} />}
                        {activeTab === 'change' && <ChangeControlView db={db} />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
