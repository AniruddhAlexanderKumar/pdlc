name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This repository's deployed app is the apps/* Kysely/Vite workspace. The
# previously checked-in workflow targeted a different Prisma/Next application:
# npx downloaded an unpinned Prisma CLI and the referenced npm scripts did not
# exist. The legacy source files remain untouched; checks below exercise the
# application in the root workspace, including its actual migration runner.
jobs:
  static:
    name: Typecheck, unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    name: PostgreSQL integration, browser and production image
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: founders_boundary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d founders_boundary_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/founders_boundary_test
      NODE_ENV: test
      APP_URL: http://localhost:5173
      LOG_LEVEL: error
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build application
        run: npm run build
      - name: Apply Kysely migrations to disposable PostgreSQL
        run: npm run migrate
      - name: Build production Docker image
        run: docker build -t solution-velocity:ci .
      - name: Verify production image health against migrated test database
        run: |
          set -euo pipefail
          trap 'docker rm -f sv-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name sv-ci --network host \
            -e DATABASE_URL -e APP_URL -e LOG_LEVEL -e NODE_ENV=production \
            -e MIGRATIONS_ON_STARTUP=false -e PORT=3050 solution-velocity:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3050/api/health | grep -q '"status":"ok"'; then exit 0; fi
            if [ "$i" -eq 40 ]; then docker logs sv-ci; exit 1; fi
            sleep 1
          done
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - name: API and browser integration tests
        env:
          CAD_NATIVE_EXPERIMENTAL: 'true'
          HOST: 127.0.0.1
          MIGRATIONS_ON_STARTUP: 'false'
          DESIGN_SMOKE_URL: http://localhost:4000
          FOUNDERS_SMOKE_URL: http://localhost:4000
          FOUNDERS_SMOKE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/founders_boundary_test
          STUDIO_TEST_URL: http://localhost:5173
          CADIT_TEST_URL: http://localhost:5173
        run: |
          set -euo pipefail
          export STUDIO_PLAYWRIGHT_MODULE="$GITHUB_WORKSPACE/node_modules/playwright-core/index.mjs"
          export CADIT_PLAYWRIGHT_MODULE="$STUDIO_PLAYWRIGHT_MODULE"
          export STUDIO_CHROMIUM_MODULE="$GITHUB_WORKSPACE/apps/web/scripts/ci-chromium.mjs"
          export CADIT_CHROMIUM_MODULE="$STUDIO_CHROMIUM_MODULE"
          node apps/server/dist/index.js > "$RUNNER_TEMP/sv-api.log" 2>&1 & api=$!
          npm run dev --workspace @sv/web -- --host 127.0.0.1 > "$RUNNER_TEMP/sv-web.log" 2>&1 & web=$!
          trap 'kill "$api" "$web" ${designer:-} ${embed:-} 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:4000/api/health >/dev/null && curl -fsS http://localhost:5173/ >/dev/null; then break; fi
            if [ "$i" -eq 40 ]; then cat "$RUNNER_TEMP/sv-api.log" "$RUNNER_TEMP/sv-web.log"; exit 1; fi
            sleep 1
          done
          node apps/server/scripts/design-studio-smoke.mjs
          node apps/server/scripts/founders-boundary-smoke.mjs
          node apps/web/scripts/studio-home-integration-smoke.mjs
          node apps/web/scripts/studio-home-browser-smoke.mjs
          node apps/web/scripts/cadit-browser-smoke.mjs
          # The product designer is a separate HTML entry with its own frame policy.
          node --import tsx --input-type=module -e 'import {createApp} from "./apps/server/src/app.ts"; createApp().listen(4173,"127.0.0.1");' > "$RUNNER_TEMP/sv-designer.log" 2>&1 & designer=$!
          node -e 'require("http").createServer((q,r)=>{r.writeHead(200,{"Content-Type":"text/html"});r.end("<iframe src=\"http://localhost:4173/product-designer.html\" style=\"width:100%;height:900px\"></iframe>")}).listen(4174,"127.0.0.1")' > "$RUNNER_TEMP/sv-embed.log" 2>&1 & embed=$!
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:4173/product-designer.html >/dev/null && curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            if [ "$i" -eq 20 ]; then cat "$RUNNER_TEMP/sv-designer.log" "$RUNNER_TEMP/sv-embed.log"; exit 1; fi
            sleep 1
          done
          DESIGNER_TEST_URL=http://localhost:4173 node apps/web/scripts/product-designer-smoke.mjs
          # Verify the default-off gate in a separate server process.
          kill "$api"; wait "$api" || true
          CAD_NATIVE_EXPERIMENTAL=false node apps/server/dist/index.js > "$RUNNER_TEMP/sv-api-disabled.log" 2>&1 & api=$!
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:4000/api/health >/dev/null; then break; fi
            if [ "$i" -eq 40 ]; then cat "$RUNNER_TEMP/sv-api-disabled.log"; exit 1; fi
            sleep 1
          done
          export BROWSER_EXECUTABLE="$(node -e 'console.log(require("playwright-core").chromium.executablePath())')"
          CAD_BROWSER_URL=http://localhost:5173 PLAYWRIGHT_MODULE="$STUDIO_PLAYWRIGHT_MODULE" node apps/web/scripts/cad-disabled-smoke.mjs
