name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch rather than queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that needs no database. Kept separate so a broken type or lint
  # error fails in under a minute instead of after a container boots.
  static:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The Prisma client is generated code and not committed, so every job
      # that compiles or imports it must generate first.
      - name: Generate Prisma client
        run: npx prisma generate

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  # Everything that needs a real database. PostgreSQL runs as a service
  # container — the same engine and major version as production, not SQLite
  # and not an emulation.
  database:
    name: Integration and E2E against PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          # CI-only, ephemeral, and never a production credential: this
          # database exists for the length of one job on an isolated runner
          # and is destroyed with it. Real deployments read DATABASE_URL from
          # their own secret store.
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pdlc_test
        ports:
          - 5432:5432
        # Without this the first migration can race the server's startup.
        options: >-
          --health-cmd "pg_isready -U postgres -d pdlc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pdlc_test?schema=public
      NEXT_PUBLIC_APP_NAME: PDLC Platform
      LOG_LEVEL: error

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # `migrate deploy` applies the committed migrations exactly as a
      # deployment would. It never resets or drops anything, so a migration
      # that only works via `db push` fails here.
      - name: Apply migrations
        run: npm run db:migrate:deploy

      # Prisma replays the migrations into a shadow database to compare them
      # against the schema, and RESETS whatever it is pointed at. It must
      # therefore be a throwaway database, never the one holding the test data.
      - name: Create throwaway shadow database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE pdlc_shadow;'

      - name: Verify migrations match the schema
        # Exit code 2 means the committed migrations would not reproduce the
        # current schema.prisma — someone edited the schema without adding a
        # migration. Exit 0 means they agree.
        run: |
          npx prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema ./prisma/schema.prisma \
            --shadow-database-url "postgresql://postgres:postgres@localhost:5432/pdlc_shadow?schema=public" \
            --exit-code

      # Builds the actual production image from the actual Dockerfile and
      # proves it starts against this job's already-migrated database —
      # the one part of "does the production container work" that a plain
      # `npm run build` (below) does not touch at all, since that runs the
      # app directly on the runner, never through the image a real
      # deployment would pull. `--network host` puts the container on the
      # runner's own network namespace so it can reach the Postgres service
      # container at `localhost:5432` exactly like every other step here
      # does, and so this step can curl it back on `localhost` too.
      - name: Build production Docker image
        run: docker build -t pdlc-platform:ci .

      - name: Start production container and verify health
        run: |
          docker run -d --name pdlc-smoke --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e NODE_ENV=production \
            -e LOG_LEVEL=error \
            -e PORT=3050 \
            pdlc-platform:ci

          # The container's own process starting is not the same claim as
          # "ready to serve" — poll rather than assume the first request lands
          # after some arbitrary sleep.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3050/api/health/live > /dev/null; then
              echo "Liveness OK after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Container never became live; logs:"
              docker logs pdlc-smoke
              exit 1
            fi
            sleep 1
          done

          # Readiness against the real, migrated schema this job just applied.
          readiness=$(curl -fsS http://localhost:3050/api/health)
          echo "$readiness"
          echo "$readiness" | grep -q '"status":"ok"' || {
            echo "Readiness check did not report ok"
            docker logs pdlc-smoke
            exit 1
          }
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pdlc_test?schema=public

      - name: Stop production container
        if: always()
        run: docker rm -f pdlc-smoke || true

      # Runs the repository layer against real PostgreSQL: composite keys,
      # include/select shapes, unique constraints, cascades and scoping.
      - name: Integration tests (real PostgreSQL)
        run: npm run test:integration

      - name: Seed a development account for the E2E run
        env:
          SEED_ORGANIZATION_NAME: CI Aerospace
          SEED_ADMIN_NAME: CI Engineer
          SEED_ADMIN_EMAIL: ci@example.test
          # Generated per run and never committed. Not a shared secret: the
          # database is destroyed when the job ends.
          SEED_ADMIN_PASSWORD: ${{ format('ci-{0}-{1}', github.run_id, github.run_attempt) }}
        run: npm run db:seed

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # With PostgreSQL reachable, the database-dependent specs that skip
      # locally actually execute here.
      - name: End-to-end tests (real PostgreSQL)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
