# Production stack: app + PostgreSQL. Put a TLS-terminating reverse proxy in front
# (see deploy/Caddyfile), or point an existing nginx at port 4000.
#
#   cp .env.production.example .env.production   # fill in APP_URL and POSTGRES_PASSWORD
#   docker compose --env-file .env.production up -d --build
#   docker compose exec app node dist/scripts/create-admin.js --email you@company.com --name "You"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: velocity
      POSTGRES_USER: velocity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U velocity -d velocity']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      APP_URL: ${APP_URL:?set APP_URL, e.g. https://velocity.yourcompany.com}
      DATABASE_URL: postgres://velocity:${POSTGRES_PASSWORD}@db:5432/velocity
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RESET_SMTP_HOST: ${RESET_SMTP_HOST:-}
      RESET_SMTP_FROM: ${RESET_SMTP_FROM:-}
      RESET_SMTP_PORT: ${RESET_SMTP_PORT:-587}
      RESET_SMTP_SECURE: ${RESET_SMTP_SECURE:-false}
      RESET_SMTP_USER: ${RESET_SMTP_USER:-}
      RESET_SMTP_PASSWORD: ${RESET_SMTP_PASSWORD:-}
      INSIGHTS_PROVIDER: ${INSIGHTS_PROVIDER:-rules}
      ASSISTANT_AI_ENABLED: ${ASSISTANT_AI_ENABLED:-false}
      ASSISTANT_PROVIDERS: ${ASSISTANT_PROVIDERS:-}
      ASSISTANT_AIMLAPI_KEY: ${ASSISTANT_AIMLAPI_KEY:-}
      ASSISTANT_AIMLAPI_MODEL: ${ASSISTANT_AIMLAPI_MODEL:-}
      ASSISTANT_OPENROUTER_KEY: ${ASSISTANT_OPENROUTER_KEY:-}
      ASSISTANT_OPENROUTER_MODEL: ${ASSISTANT_OPENROUTER_MODEL:-}
      ASSISTANT_GEMINI_MODEL: ${ASSISTANT_GEMINI_MODEL:-}
      ASSISTANT_GEMINI_API_KEY_1: ${ASSISTANT_GEMINI_API_KEY_1:-}
      ASSISTANT_GEMINI_API_KEY_2: ${ASSISTANT_GEMINI_API_KEY_2:-}
      ASSISTANT_GEMINI_API_KEY_3: ${ASSISTANT_GEMINI_API_KEY_3:-}
      ASSISTANT_GEMINI_API_KEY_4: ${ASSISTANT_GEMINI_API_KEY_4:-}
      AI_BASE_URL: ${AI_BASE_URL:-http://127.0.0.1:8091/v1}
      AI_MODEL: ${AI_MODEL:-qwen2.5-14b-instruct}
      AI_API_KEY: ${AI_API_KEY:-}
    ports:
      # Bound to localhost: expose it publicly only through your reverse proxy.
      - '127.0.0.1:4000:4000'

volumes:
  pgdata:
