services:
  - type: web
    name: pdlc-platform
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: ohio
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        value: https://pdlc.dalvigroup.co.in
