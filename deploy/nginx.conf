# Example nginx site. TLS certificates via certbot or your own CA.
server {
    listen 443 ssl http2;
    server_name velocity.yourcompany.com;

    ssl_certificate     /etc/letsencrypt/live/velocity.yourcompany.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/velocity.yourcompany.com/privkey.pem;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name velocity.yourcompany.com;
    return 301 https://$host$request_uri;
}
